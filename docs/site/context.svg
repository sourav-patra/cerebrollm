<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">cerebrollm in its surroundings</title>
  <desc id="d">You ask cerebrollm a question in the terminal. On your computer, cerebrollm reads your Markdown notes and uses local models run by Ollama to embed text and write answers. Optionally, an AI app with a hosted model calls cerebrollm's search and verify tools over MCP; the passages it fetches go to that model's provider. Solid lines stay local while Ollama uses its default loopback address; cerebrollm refuses any other address unless allow_remote = true is set under [ollama]. You chat with that app directly.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <g font-size="12" fill="#1f2933">
    <text x="20" y="30" font-size="15" font-weight="700">Who and what cerebrollm talks to</text>
    <text x="20" y="48">Arrows point from the caller. What travels on a dashed line reaches a hosted model's provider.</text>
    <text x="20" y="63">Solid lines stay on your computer while Ollama uses its default loopback address.</text>
  </g>
  <rect x="260" y="70" width="625" height="355" rx="10" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="276" y="94" font-size="13" font-weight="700" fill="#1f2933">Your computer</text>

  <g stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path id="e-ask" d="M220 150 L366 236"/>
    <path id="e-notes" d="M590 235 L666 160"/>
    <path id="e-models" d="M590 285 L666 350"/>
  </g>
  <g stroke="#1f2933" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)">
    <path id="e-mcp" d="M220 365 L366 285" marker-start="url(#ar)"/>
    <path id="e-chat" d="M120 192 V316" marker-start="url(#ar)"/>
  </g>
  <g font-size="12" fill="#1f2933">
    <text x="305" y="180">ask</text>
    <text x="296" y="352">search, verify (MCP);</text>
    <text x="296" y="368">passages go back</text>
    <text x="130" y="258">chat</text>
    <text x="622" y="185" text-anchor="end">read, re-check</text>
    <text x="624" y="342" text-anchor="end">embed, answer</text>
  </g>

  <g stroke="#1f2933" stroke-width="2">
    <rect x="20" y="110" width="200" height="80" rx="40" fill="#dcfce7"/>
    <rect x="20" y="320" width="200" height="90" rx="6" fill="#fef3c7" stroke-dasharray="6 4"/>
    <rect x="370" y="210" width="220" height="100" rx="6" fill="#dbeafe" stroke-width="3"/>
    <rect x="670" y="105" width="195" height="80" rx="6" fill="#f1f5f9"/>
    <rect x="670" y="320" width="195" height="90" rx="6" fill="#f1f5f9"/>
  </g>
  <g font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">
    <text x="120" y="146">You</text>
    <text x="120" y="360">AI app, hosted model</text>
    <text x="480" y="254">cerebrollm</text>
    <text x="767" y="141">Your notes</text>
    <text x="767" y="360">Local models</text>
  </g>
  <g font-size="12" fill="#1f2933" text-anchor="middle">
    <text x="120" y="166">ask in the terminal</text>
    <text x="120" y="380">for example Claude; optional</text>
    <text x="480" y="276">finds passages; answers only</text>
    <text x="480" y="292">with a confirmed quote</text>
    <text x="767" y="161">Markdown files</text>
    <text x="767" y="380">run by Ollama</text>
  </g>
</svg>
