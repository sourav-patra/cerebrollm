<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t2">Order of calls in cerebrollm ask</title>
  <desc id="d2">Sequence of one ask call. The user's question goes to the ask pipeline, which checks the model name, searches the top 20 hits, reranks to 8, asks the local generator for an answer with a quote and path, sends every citation to verify, and prints the answer only if at least one citation returns OK. Otherwise it prints Not in the sources. A failure in an earlier step exits with code 2 and prints no answer.</desc>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- participants -->
  <g font-size="13" font-weight="bold" fill="#082f49" text-anchor="middle">
    <rect x="20" y="20" width="120" height="48" rx="6" fill="#ecfccb" stroke="#365314" stroke-width="1.5"/>
    <text x="80" y="42">User</text><text x="80" y="58" font-weight="normal" font-size="11">cerebrollm ask</text>
    <rect x="180" y="20" width="130" height="48" rx="6" fill="#e0f2fe" stroke="#075985" stroke-width="2.5"/>
    <text x="245" y="42">ask pipeline</text><text x="245" y="58" font-weight="normal" font-size="11">answer.py</text>
    <rect x="350" y="20" width="140" height="48" rx="6" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/>
    <text x="420" y="42">Search</text><text x="420" y="58" font-weight="normal" font-size="11">Postgres + embedding</text>
    <rect x="530" y="20" width="120" height="48" rx="6" fill="#e0f2fe" stroke="#075985" stroke-width="1.5"/>
    <text x="590" y="42">Rerank</text><text x="590" y="58" font-weight="normal" font-size="11">rerank.py</text>
    <rect x="690" y="20" width="130" height="48" rx="6" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1.5"/>
    <text x="755" y="42">Generator</text><text x="755" y="58" font-weight="normal" font-size="11">Ollama chat</text>
    <rect x="860" y="20" width="120" height="48" rx="6" fill="#e0f2fe" stroke="#075985" stroke-width="1.5"/>
    <text x="920" y="42">verify</text><text x="920" y="58" font-weight="normal" font-size="11">source files + index</text>
  </g>

  <!-- lifelines -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="80" y1="68" x2="80" y2="650"/>
    <line x1="245" y1="68" x2="245" y2="650"/>
    <line x1="420" y1="68" x2="420" y2="650"/>
    <line x1="590" y1="68" x2="590" y2="650"/>
    <line x1="755" y1="68" x2="755" y2="650"/>
    <line x1="920" y1="68" x2="920" y2="650"/>
  </g>

  <!-- messages -->
  <g stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#b)">
    <line x1="82" y1="105" x2="243" y2="105"/>
    <line x1="247" y1="190" x2="418" y2="190"/>
    <line x1="247" y1="260" x2="588" y2="260"/>
    <line x1="247" y1="330" x2="753" y2="330"/>
    <line x1="247" y1="400" x2="918" y2="400"/>
    <line x1="243" y1="525" x2="82" y2="525"/>
  </g>
  <g stroke="#1f2937" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#b)">
    <line x1="418" y1="220" x2="247" y2="220"/>
    <line x1="588" y1="290" x2="247" y2="290"/>
    <line x1="753" y1="360" x2="247" y2="360"/>
    <line x1="918" y1="430" x2="247" y2="430"/>
  </g>
  <!-- self step: check model, decide -->
  <g stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#b)">
    <path d="M247,140 H300 V158 H247"/>
    <path d="M247,470 H300 V488 H247"/>
  </g>

  <!-- numbers and labels -->
  <g font-size="12" fill="#111827">
    <text x="90" y="98">1 question</text>
    <text x="306" y="153">2 model name must be allow-listed and not -cloud</text>
    <text x="256" y="183">3 search top 20</text>
    <text x="256" y="213">20 hits: text, path, line span</text>
    <text x="256" y="253">4 score the 20 hits against the question</text>
    <text x="256" y="283">top 8; reranker released</text>
    <text x="256" y="323">5 prompt: top 8 inside a context block marked as data</text>
    <text x="256" y="353">text with "quote" [path]</text>
    <text x="256" y="393">6 every (path, quote) pair</text>
    <text x="256" y="423">OK, CHANGED, MISSING, GONE or UNINDEXED per pair</text>
    <text x="306" y="483">7 decide: print only if at least one citation is OK</text>
    <text x="90" y="518">8 answer and codes, or exactly "Not in the sources."</text>
  </g>

  <!-- verify annotation -->
  <rect x="800" y="440" width="190" height="58" rx="5" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
  <g font-size="11" fill="#111827">
    <text x="808" y="458">verify reads the file again and</text>
    <text x="808" y="474">compares its sha256 with the</text>
    <text x="808" y="490">indexed one (verify.py)</text>
  </g>

  <!-- failure note -->
  <rect x="20" y="560" width="960" height="100" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
  <g font-size="12.5" fill="#431407">
    <text x="34" y="584" font-weight="bold">Failure and no-hit paths</text>
    <text x="34" y="606">An exception in steps 2 to 6 (search, rerank, generation, an unreachable service, a refused model name): one line on stderr, exit code 2, nothing on stdout.</text>
    <text x="34" y="626">No hits in step 3: the generator is not called and the output is exactly "Not in the sources." (exit code 0).</text>
    <text x="34" y="646">Step 7 prints "Not in the sources." too when the text is empty or starts with that phrase, whatever the citations say.</text>
  </g>
  <text x="500" y="690" font-size="11" fill="#334155" text-anchor="middle">Solid arrows are calls, dashed arrows are replies. All steps are current in 0.1.0.</text>
</svg>
