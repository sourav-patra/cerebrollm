<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="t3 d3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t3">The ask output gate now and as proposed in issue I-02</title>
  <desc id="d3">Two columns. Current: the generator's text goes to verify for each quote and path pair, the gate checks that at least one citation is OK, and if so prints the generator's whole text with the verify codes, otherwise prints Not in the sources. Proposed in I-02: a new step keeps only citations whose path is one of the 8 retrieved hits, then verify, then the gate prints only the verified quotes with their paths, and shows the generator's text only with a flag, marked as unverified.</desc>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>

  <text x="245" y="34" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Current in 0.1.0 (answer.decide)</text>
  <text x="735" y="34" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Proposed in I-02</text>
  <line x1="490" y1="20" x2="490" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- current panel -->
  <g fill="#e0f2fe" stroke="#075985" stroke-width="1.5">
    <rect x="55" y="60" width="380" height="54" rx="6"/>
    <rect x="55" y="144" width="380" height="54" rx="6"/>
    <rect x="55" y="228" width="380" height="54" rx="6" stroke-width="2.5"/>
  </g>
  <g font-size="13" fill="#082f49" text-anchor="middle">
    <text x="245" y="83" font-weight="bold">Generator text</text><text x="245" y="102" font-size="12">with "quote" [path] citations</text>
    <text x="245" y="167" font-weight="bold">verify each (path, quote) pair</text><text x="245" y="186" font-size="12">OK, CHANGED, MISSING, GONE or UNINDEXED</text>
    <text x="245" y="251" font-weight="bold">Gate</text><text x="245" y="270" font-size="12">is at least one citation OK?</text>
  </g>
  <g fill="#fef9c3" stroke="#854d0e" stroke-width="1.5">
    <rect x="45" y="340" width="200" height="110" rx="6"/>
  </g>
  <g fill="#f1f5f9" stroke="#475569" stroke-width="1.5">
    <rect x="265" y="340" width="180" height="110" rx="6"/>
  </g>
  <g font-size="12" fill="#1c1917" text-anchor="middle">
    <text x="145" y="364" font-weight="bold" font-size="13">yes</text>
    <text x="145" y="384">print the generator's whole</text>
    <text x="145" y="401">text, then one verify code</text>
    <text x="145" y="418">per citation</text>
    <text x="145" y="438" fill="#9a3412">unchecked text can print</text>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="355" y="364" font-weight="bold" font-size="13">no, or empty text</text>
    <text x="355" y="384">print exactly</text>
    <text x="355" y="401">Not in the sources.</text>
  </g>
  <g stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#c)">
    <line x1="245" y1="114" x2="245" y2="142"/>
    <line x1="245" y1="198" x2="245" y2="226"/>
    <line x1="170" y1="282" x2="145" y2="338"/>
    <line x1="320" y1="282" x2="355" y2="338"/>
  </g>
  <text x="116" y="314" font-size="12" fill="#111827">yes</text>
  <text x="354" y="308" font-size="12" fill="#111827">no</text>

  <!-- proposed panel -->
  <g fill="#e0f2fe" stroke="#075985" stroke-width="1.5">
    <rect x="545" y="60" width="380" height="54" rx="6"/>
    <rect x="545" y="214" width="380" height="54" rx="6"/>
    <rect x="545" y="298" width="380" height="54" rx="6" stroke-width="2.5"/>
  </g>
  <rect x="545" y="130" width="380" height="68" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2.5" stroke-dasharray="8 4"/>
  <g font-size="13" fill="#082f49" text-anchor="middle">
    <text x="735" y="83" font-weight="bold">Generator text</text><text x="735" y="102" font-size="12">with "quote" [path] citations</text>
    <text x="735" y="237" font-weight="bold">verify each remaining pair</text><text x="735" y="256" font-size="12">OK, CHANGED, MISSING, GONE or UNINDEXED</text>
    <text x="735" y="321" font-weight="bold">Gate</text><text x="735" y="340" font-size="12">is at least one citation OK?</text>
  </g>
  <g font-size="13" fill="#14532d" text-anchor="middle">
    <text x="735" y="152" font-weight="bold">New: bind citations to the hits</text>
    <text x="735" y="171" font-size="12">keep a citation only if its path is one of the 8</text>
    <text x="735" y="188" font-size="12">hits the generator was given</text>
  </g>
  <g fill="#dcfce7" stroke="#166534" stroke-width="1.5">
    <rect x="535" y="400" width="220" height="100" rx="6"/>
  </g>
  <g fill="#f1f5f9" stroke="#475569" stroke-width="1.5">
    <rect x="775" y="400" width="160" height="100" rx="6"/>
  </g>
  <g font-size="12" fill="#14532d" text-anchor="middle">
    <text x="645" y="421" font-weight="bold" font-size="13">yes</text>
    <text x="645" y="440">print the verified quotes with</text>
    <text x="645" y="456">their paths; generator text only</text>
    <text x="645" y="472">with --show-text, marked</text>
    <text x="645" y="488">"Unverified text:"</text>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="855" y="421" font-weight="bold" font-size="13">no</text>
    <text x="855" y="444">print exactly</text>
    <text x="855" y="461">Not in the sources.</text>
  </g>
  <g stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#c)">
    <line x1="735" y1="114" x2="735" y2="128"/>
    <line x1="735" y1="198" x2="735" y2="212"/>
    <line x1="735" y1="268" x2="735" y2="296"/>
    <line x1="660" y1="352" x2="645" y2="398"/>
    <line x1="810" y1="352" x2="855" y2="398"/>
  </g>
  <text x="618" y="378" font-size="12" fill="#111827">yes</text>
  <text x="846" y="368" font-size="12" fill="#111827">no</text>
</svg>
