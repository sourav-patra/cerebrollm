# Allowed local models (issue #9). Read by research/model-study/model_guard.py; nothing else may be pulled.
# Licence rule: Apache-2.0 or MIT only. A model with another licence stays listed with allowed = false and a reason.
# num_ctx caps: 8192 for role "embedding", 16384 for role "chat" (the guard rejects a larger value).
# Sizes are not stored: the guard reads the current manifest at registry.ollama.ai before every pull and applies the floor to it.
# digest: full sha256 shown by /api/tags; empty until the guard records it after a pull. Never edit by hand.

[host]
# Disk holding the Ollama model store (C:\Users\<user>\.ollama\models); the Ubuntu path is the Windows C: mount.
disk_path = "/mnt/c"
disk_path_windows = "C:\\"
floor_gb = 8  # a pull may never leave less free space than this (GiB)

[models."bge-m3"]
