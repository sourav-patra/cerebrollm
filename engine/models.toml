# Reranker for `cerebrollm ask` and the MCP search option `rerank` (lane N7). Not an Ollama model: a cross-encoder run by
# sentence-transformers from a local folder, fetched once from Hugging Face at the pinned revision (files and sha256 in
# eval/runs/retrieval/n7-evidence/bge-reranker-v2-m3.sha256). The model guard does not read this section.
[reranker."BAAI/bge-reranker-v2-m3"]
licence = "Apache-2.0"
licence_source = "Hugging Face model card metadata license: apache-2.0 (api/models/BAAI/bge-reranker-v2-m3), checked 2026-10-29"
revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
local_dir = "~/.cerebrollm/models/bge-reranker-v2-m3"
model_sha256 = "d9e3e081faff1eefb84019509b2f5558fd74c1a05a2c7db22f74174fcedb5286"   # model.safetensors, equals the Hugging Face LFS oid
max_length = 1024   # tokens per (query, chunk) pair; chunks are at most 800 tokens
